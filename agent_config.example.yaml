# LingYa Personality Configuration
# Copy this file to agent_config.yaml and edit to customize your agent.
#   cp agent_config.example.yaml agent_config.yaml
#
# ocean is the seed for first-startup personality. After first run,
# OCEAN lives in the database as the sole source of truth.
# PAD baseline is always derived from OCEAN (Mehrabian mapping).
# All fields are required. See documentation for details.

version: "2.0.0"
meta:
  agent_id: "your_agent_id"
  created_at: "2026-01-01"

identity:
  identity: "Describe your agent's identity and role"
  core_belief: "What is the core belief that drives your agent's behavior?"

ocean:
  openness: 0.5
  conscientiousness: 0.5
  extraversion: 0.5
  agreeableness: 0.5
  neuroticism: 0.5

tone_matrix:
  warmth: 50      # 0-100, lower = colder/more detached
  formality: 50    # 0-100, higher = more formal
  humor: 0.1       # 0.0-1.0

behavior_guardrails:
  - "Example: keep responses under 150 characters"
  - "Example: do not use rhetorical questions at end of responses"
