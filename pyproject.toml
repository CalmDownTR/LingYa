[project]
name = "lingya"
version = "0.2.0"
description = "An autonomous AI agent with memory and evolving personality"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "langchain>=1.3.1",
    "deepagents>=0.6.3",
    "langchain-mcp-adapters>=0.2.2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]
