[project]
name = "lingya"
version = "0.9.4"
description = "An autonomous AI agent with memory and evolving personality"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "litellm>=1.70.0",
    "langchain>=1.3.1",
    "deepagents>=0.6.3",
    "langchain-mcp-adapters>=0.2.2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "chromadb>=0.5.0",
    "deepeval>=4.0.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "traceloop-sdk>=0.61.0",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests that require real infrastructure (DB, WS server, ports)",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]
