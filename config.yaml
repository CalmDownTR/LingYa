llm:
  model: deepseek/deepseek-v4-flash
  temperature: 0.7
  max_tokens: 32768           # Max output tokens per response (not context window). v4-flash上限 384K
  # fallbacks: ["openai/gpt-4o", "anthropic/claude-sonnet-4"]  # 可选：主模型重试耗尽后依次尝试的备用模型
  # auxiliary_model: deepseek/deepseek-v4-flash  # 可选：MindEngine OCC/IPC/反思用独立模型（不配则复用主模型）

db_path: ./data/lingya.db
data_dir: ./data
memory_path: ./data/memory

otel:
  enabled: false  # Set to true to enable OpenTelemetry tracing (console exporter)
